[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-algorithm"
version = "1.3.0"
description = "EEG 在线与离线算法包（供 C++ 通过 pybind11 调用）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
phase = ["torch>=2.0"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"eeg_algorithm.resources" = ["electrode_layouts/*.json"]
